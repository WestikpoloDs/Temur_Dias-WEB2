    <div class="card-row">

      <div class="card">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river">

          <h3>Mountain River</h3>
          <p>A calm river winding through the mountains.</p>

        </div>

      <div class="card">
        <img src="https://picsum.photos/id/1018/400/300" alt="Forest lake">
        <div class="card-body">
